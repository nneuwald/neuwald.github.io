:root {
  --bg: #f7f4f9;
  --surface: #ffffff;
  --ink: #2b1a30;
  --muted: #6e5f74;
  --line: #e4dce8;
  --hero: #3b1f45;
  --hero-ink: #fbf6fd;
  --hero-muted: #d9c6e0;
  --keep: #2a7549;
  --keep-soft: #e1f1e6;
  --modify: #8f5a00;
  --modify-soft: #fbefd2;
  --discard: #6f6375;
  --discard-soft: #ebe6ee;
  --heart: #cf2460;
  --heart-soft: #fbe2ea;
  --health: #4a9a2e;
  --yummy: #e2622a;
  --bad: #b3261e;
  --display: "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --pad: max(16px, env(safe-area-inset-left, 0px));
  --pad-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a111d;
    --surface: #251a2a;
    --ink: #f2eaf5;
    --muted: #ad9db3;
    --line: #3a2b40;
    --hero: #2f1a37;
    --hero-ink: #f8f0fb;
    --hero-muted: #c5b0cd;
    --keep: #86d3a0;
    --keep-soft: #1d3626;
    --modify: #ecbb5e;
    --modify-soft: #3a2d12;
    --discard: #a698ab;
    --discard-soft: #33283a;
    --heart: #ff6f9c;
    --heart-soft: #48192b;
    --health: #9bd36a;
    --yummy: #ff8f5e;
    --bad: #ff8a80;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; cursor: pointer; }
:focus-visible { outline: 3px solid var(--heart); outline-offset: 2px; }

/* ---------- hero ---------- */
.hero {
  background: var(--hero);
  color: var(--hero-ink);
  padding: 34px var(--pad-r) 30px var(--pad);
}
.hero-in, .bar-in, main { max-width: 560px; margin: 0 auto; }
.hero-in { max-width: 528px; }  /* lines the title up with the list on wide screens */
h1 {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(2.9rem, 15vw, 4.4rem);
  line-height: 0.92;
  letter-spacing: -0.035em;
  margin: 0 0 16px;
}
.hero p { margin: 0; color: var(--hero-muted); font-size: 1.02rem; max-width: 34ch; }
.hero .hint { margin-top: 10px; font-size: 0.92rem; }

/* ---------- sticky bar ---------- */
.bar {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 10px 0 8px;
}
@supports ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
  .bar {
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  }
}
.bar-top {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 0 var(--pad-r) 0 var(--pad);
}
.progress-text { font-weight: 600; font-size: 0.95rem; }
.status { font-size: 0.82rem; color: var(--muted); white-space: nowrap; }
.status::before {
  content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--muted); margin-right: 6px; vertical-align: 1px;
}
.status.ok::before { background: var(--keep); }
.status.bad { color: var(--bad); }
.status.bad::before { background: var(--bad); }
.meter {
  display: flex; height: 6px; border-radius: 3px; overflow: hidden;
  background: var(--line); margin: 8px var(--pad-r) 10px var(--pad);
}
.meter i { display: block; height: 100%; width: 0; transition: width 0.25s ease; }
.meter .m-keep { background: var(--keep); }
.meter .m-modify { background: var(--modify); }
.meter .m-discard { background: var(--discard); }
.chips {
  display: flex; gap: 8px; overflow-x: auto;
  padding: 0 var(--pad-r) 2px var(--pad);
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 40px; padding: 0 14px;
  border: 1px solid var(--line); border-radius: 20px;
  background: var(--surface); font-size: 0.92rem; font-weight: 500; white-space: nowrap;
}
.chip b { font-weight: 500; color: var(--muted); margin-left: 5px; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.sort { display: inline-flex; align-items: center; gap: 6px; padding-right: 12px; cursor: pointer; }
.chip.sort span { color: var(--muted); }
.chip.sort select {
  -webkit-appearance: none; appearance: none; border: 0; background: transparent; color: inherit;
  font: inherit; font-size: 16px; font-weight: 600; height: 38px; padding: 0 18px 0 0; margin: 0; cursor: pointer;
}
.chip.sort select:focus { outline: none; }
.chip.sort:focus-within { outline: 3px solid var(--heart); outline-offset: 2px; }
.chip.sort::after {
  content: ""; width: 7px; height: 7px; margin: -4px 0 0 -16px; pointer-events: none;
  border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg);

.chip[aria-pressed="true"] b { color: inherit; opacity: 0.7; }

/* ---------- list ---------- */
main {
  padding: 8px var(--pad-r) calc(56px + env(safe-area-inset-bottom, 0px)) var(--pad);

section { margin-top: 26px; }
h2 {
  font-family: var(--display);

.group {

.dish { position: relative; padding: 16px 14px 16px 18px; border-top: 1px solid var(--line); }
.dish:first-child, .dish.first { border-top: 0; }
.dish::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: transparent;

.dish[data-status="keep"]::before { background: var(--keep); }
.dish[data-status="modify"]::before { background: var(--modify); }
.dish[data-status="discard"]::before { background: var(--discard); }
.dish[data-heart="1"] { background: linear-gradient(90deg, var(--heart-soft), transparent 70%); }

.head { display: flex; align-items: flex-start; gap: 8px; }
.txt { flex: 1; min-width: 0; padding-top: 2px; }
.name {
  font-family: var(--display); font-weight: 700; font-size: 1.18rem; line-height: 1.2;
  letter-spacing: -0.01em; margin: 0; text-wrap: balance;

.desc { margin: 5px 0 0; color: var(--muted); font-size: 0.95rem; line-height: 1.42; }
.dish[data-status="discard"] .name { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.dish[data-status="discard"] .desc, .dish[data-status="discard"] .scores { display: none; }

/* health and yummy estimates, 1 to 5 */
.scores { display: flex; gap: 16px; margin-top: 12px; }
.score { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 7px; }
.score-label { font-size: 0.82rem; font-weight: 600; color: var(--muted); }
.pips { flex: 1; display: flex; gap: 3px; }
.pips i { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
.health .pips .on { background: var(--health); }
.yummy .pips .on { background: var(--yummy); }
.score-num { font-size: 0.85rem; font-weight: 700; font-variant-numeric: tabular-nums; }

.heart {
  flex: none; width: 46px; height: 46px; margin: -8px -6px -10px 0;
  display: grid; place-items: center;
  border: 0; border-radius: 50%; background: transparent; color: var(--muted);

.heart svg { width: 27px; height: 27px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.heart[aria-pressed="true"] { color: var(--heart); }
.heart[aria-pressed="true"] svg { fill: currentColor; }
.heart.pop svg { animation: pop 0.34s ease; }
@keyframes pop { 40% { transform: scale(1.38); } 100% { transform: scale(1); } }
.dish[data-status="discard"] .heart { visibility: hidden; }

.choices { display: flex; gap: 8px; margin-top: 13px; }
.choice {
  flex: 1; min-height: 46px; padding: 0 6px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1.5px solid var(--line); border-radius: 13px; background: transparent;
  font-size: 0.95rem; font-weight: 600;
}
.choice svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.choice[data-v="keep"][aria-pressed="true"] { background: var(--keep-soft); border-color: var(--keep); color: var(--keep); }
.choice[data-v="modify"][aria-pressed="true"] { background: var(--modify-soft); border-color: var(--modify); color: var(--modify); }
.choice[data-v="discard"][aria-pressed="true"] { background: var(--discard-soft); border-color: var(--discard); color: var(--discard); }

.note { margin-top: 12px; }
.note label { display: block; font-weight: 600; font-size: 0.95rem; margin-bottom: 6px; color: var(--modify); }
.note textarea {
  display: block; width: 100%; min-height: 76px; resize: none;
  padding: 11px 12px; border: 1.5px solid var(--modify); border-radius: 13px;
  background: var(--bg); font-size: 16px; line-height: 1.4;
}
.note textarea:focus { outline: 3px solid var(--modify-soft); outline-offset: 0; }
.note textarea::placeholder { color: var(--muted); opacity: 0.8; }
.saved { min-height: 1.2em; margin: 5px 2px 0; font-size: 0.82rem; color: var(--muted); }

.empty { margin: 34px 4px 0; color: var(--muted); }
.foot { margin: 30px 4px 0; color: var(--muted); font-size: 0.85rem; }
[hidden] { display: none !important; }

@media (prefers-reduced-motion: reduce) {
  .heart.pop svg { animation: none; }
  .meter i { transition: none; }
}
</style>

    "Content-Type": "application/json", Prefer: "return=minimal"
  };
  var SKEY = "briMenu.sort.v1";
  var CACHE = "briMenu.state.v1";
  var QKEY = "briMenu.queue.v1";
  var STATUSES = ["keep", "modify", "discard"];
  var MAXN = DISHES.reduce(function (m, d) { return Math.max(m, d.n); }, 0);

  var state = {};     // n -> { status, note, heart }
  var queue = {};     // n -> changes waiting to be sent
  var sending = {};   // n -> changes on their way
  var typing = {};    // n -> true while a note is being edited
  var timers = {};    // n -> note debounce timer
  var rows = {};      // n -> row elements
  var writeSeq = 0;
  var sections = [];    // course sections, in menu order
  var flat = null;      // the single section used while sorted by a rating
  var sort = "menu";
  var leaving = false;  // true once the page is closing, so last writes outlive it
  var filter = "all";

  function get(n) {
    if (!state[n]) state[n] = { status: "", note: "", heart: false };
    return state[n];
  }
  function readJSON(key) {
    try { return JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (e) { return {}; }
  }
  function saveLocal() {
    var waiting = {};
    Object.keys(sending).forEach(function (n) { waiting[n] = Object.assign({}, sending[n]); });
    Object.keys(queue).forEach(function (n) { waiting[n] = Object.assign(waiting[n] || {}, queue[n]); });
    try {
      localStorage.setItem(CACHE, JSON.stringify(state));
      localStorage.setItem(QKEY, JSON.stringify(waiting));
    } catch (e) {}
  }
  function busy() { return Object.keys(queue).length > 0 || Object.keys(sending).length > 0; }

  function setStatus(ok) {
    var el = document.getElementById("status");
    el.textContent = ok ? "Synced" : "Offline. Changes will sync later.";
    el.className = "status " + (ok ? "ok" : "bad");
  }
  function setSaved(n, text) {
    if (rows[n]) rows[n].saved.textContent = text;
  }

  // Record a change locally, then send it.
  function change(n, patch) {
    Object.assign(get(n), patch);
    queue[n] = Object.assign(queue[n] || {}, patch);
    writeSeq++;
    saveLocal();
    renderRow(n);
    renderCounts();
    flush();
  }
  function flush() {
    Object.keys(queue).forEach(function (n) {
      if (sending[n]) return;           // one request per dish at a time, so they land in order
      var sent = queue[n];
      delete queue[n];
      sending[n] = sent;
      var ok = false;
      var body = Object.assign({}, sent, { updated_at: new Date().toISOString() });
      fetch(API + "?n=eq." + n, {
        method: "PATCH", headers: HEADERS, body: JSON.stringify(body), keepalive: leaving
      })
        .then(function (r) {
          if (!r.ok) throw new Error(r.status);
          ok = true;
          setStatus(true);
          if ("note" in sent && !queue[n]) setSaved(n, "Saved");
        })
        .catch(function () {
          queue[n] = Object.assign({}, sent, queue[n] || {});   // newer edits win
          setStatus(false);
          if ("note" in sent) setSaved(n, "Saved on this phone. Will sync when you're back online.");
        })
        .then(function () {
          delete sending[n];
          saveLocal();
          if (ok && queue[n]) flush();
        });
    });
  }
  function applyRemote(list) {
    var changed = false;
    list.forEach(function (x) {
      if (!rows[x.n]) return;
      var s = get(x.n);
      var status = STATUSES.indexOf(x.status) >= 0 ? x.status : "";
      var note = typing[x.n] ? s.note : (x.note || "");
      var heart = !!x.heart;
      if (s.status === status && s.note === note && s.heart === heart) return;
      s.status = status; s.note = note; s.heart = heart;
      changed = true;
      renderRow(x.n);
    });
    if (changed) { saveLocal(); renderCounts(); }
  }
  function pull() {
    if (busy()) { flush(); return; }
    var seq = writeSeq;
    fetch(API + "?select=n,status,note,heart&n=lte." + MAXN + "&order=n", { headers: HEADERS, cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (list) {
        setStatus(true);
        if (seq !== writeSeq || busy()) return;   // something changed here meanwhile; next pull catches up
        applyRemote(list);
      })
      .catch(function () { setStatus(false); });
  }

  /* ---------- notes ---------- */
  function grow(ta) {
    ta.style.height = "auto";
    ta.style.height = Math.max(76, ta.scrollHeight + 3) + "px";
  }
  function commitNote(n) {
    clearTimeout(timers[n]);
    timers[n] = null;
    var ta = rows[n].ta;
    var v = ta.value.replace(/\s+$/, "");
    typing[n] = document.activeElement === ta;
    if (v !== get(n).note) {
      setSaved(n, "Saving");
      change(n, { note: v });
    }
  }

  /* ---------- rendering ---------- */
  var ICON = {
    keep: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg>',
    modify: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L16.5 4l3.5 3.5L8.5 19 4 20z"/></svg>',
    discard: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    heart: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5l-1.3-1.2C5.4 14.5 2 11.4 2 7.6 2 4.5 4.4 2.5 7.2 2.5c1.7 0 3.4.8 4.8 2.4 1.4-1.6 3.1-2.4 4.8-2.4C19.6 2.5 22 4.5 22 7.6c0 3.8-3.4 6.9-8.7 11.7L12 20.5z"/></svg>'
  };
  var LABEL = { keep: "Keep", modify: "Modify", discard: "Discard" };

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function score(kind, label, v) {
    var pips = "";
    for (var i = 1; i <= 5; i++) pips += i <= v ? '<i class="on"></i>' : "<i></i>";
    return '<div class="score ' + kind + '" role="img" aria-label="' + label + ": " + v + ' out of 5">' +
      '<span class="score-label">' + label + '</span><span class="pips">' + pips + "</span>" +
      '<span class="score-num">' + v + "</span></div>";
  }

  function build() {
    var list = document.getElementById("list");
    var groups = {};
    flat = { sec: el("section"), h2: el("h2"), ul: el("ul", "group") };
    flat.sec.appendChild(flat.h2);
    flat.sec.appendChild(flat.ul);
    flat.sec.hidden = true;
    list.appendChild(flat.sec);
    DISHES.forEach(function (d) {
      if (!groups[d.g]) {
        var sec = el("section");
        sec.appendChild(el("h2", "", esc(d.g)));
        var ul = el("ul", "group");
        sec.appendChild(ul);
        list.appendChild(sec);
        groups[d.g] = { sec: sec, ul: ul };
        sections.push(groups[d.g]);
      }
      var li = el("li", "dish");
      var head = el("div", "head");
      head.appendChild(el("div", "txt", '<h3 class="name">' + esc(d.name) + "</h3>"));
      var heart = el("button", "heart", ICON.heart);
      heart.type = "button";
      heart.setAttribute("aria-label", "Love it: " + d.name);
      head.appendChild(heart);
      li.appendChild(head);
      li.dataset.n = d.n;
      li.appendChild(el("p", "desc", esc(d.desc)));
      li.appendChild(el("div", "scores", score("health", "Health", d.h) + score("yummy", "Yummy", d.y)));

      var choices = el("div", "choices");
      choices.setAttribute("role", "group");
      choices.setAttribute("aria-label", d.name);
      var btns = {};
      STATUSES.forEach(function (v) {
        var b = el("button", "choice", ICON[v] + "<span>" + LABEL[v] + "</span>");
        b.type = "button";
        b.dataset.v = v;
        b.addEventListener("click", function () { choose(d.n, v); });
        choices.appendChild(b);
        btns[v] = b;
      });
      li.appendChild(choices);

      var note = el("div", "note");
      var id = "note" + d.n;
      note.innerHTML = '<label for="' + id + '">What should change?</label>' +
        '<textarea id="' + id + '" rows="2" maxlength="500" enterkeyhint="done" ' +
        'placeholder="Less spicy, swap the rice, no mushrooms…"></textarea>' +
        '<p class="saved" aria-live="polite"></p>';
      note.hidden = true;
      li.appendChild(note);
      var ta = note.querySelector("textarea");
      ta.addEventListener("focus", function () { typing[d.n] = true; });
      ta.addEventListener("input", function () {
        typing[d.n] = true;
        grow(ta);
        setSaved(d.n, "");
        clearTimeout(timers[d.n]);
        timers[d.n] = setTimeout(function () { commitNote(d.n); }, 800);
      });
      ta.addEventListener("blur", function () { typing[d.n] = false; commitNote(d.n); });

      heart.addEventListener("click", function () {
        var on = !get(d.n).heart;
        change(d.n, { heart: on });
        if (on) {
          heart.classList.remove("pop");
          void heart.offsetWidth;
          heart.classList.add("pop");
        }
      });

      groups[d.g].ul.appendChild(li);
      rows[d.n] = { li: li, heart: heart, btns: btns, note: note, ta: ta, saved: note.querySelector(".saved"), home: groups[d.g] };
    });
  }

  function choose(n, v) {
    var s = get(n);
    var next = s.status === v ? "" : v;       // tapping the lit choice clears it
    var patch = { status: next };
    if (next === "discard" && s.heart) patch.heart = false;
    change(n, patch);
    if (next === "modify") {
      var ta = rows[n].ta;
      ta.focus({ preventScroll: true });
      rows[n].li.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
  }

  function renderRow(n) {
    var r = rows[n];
    if (!r) return;
    var s = get(n);
    r.li.dataset.status = s.status || "none";
    r.li.dataset.heart = s.heart ? "1" : "0";
    r.heart.setAttribute("aria-pressed", s.heart ? "true" : "false");
    STATUSES.forEach(function (v) {
      r.btns[v].setAttribute("aria-pressed", s.status === v ? "true" : "false");
    });
    var show = s.status === "modify";
    if (r.note.hidden === show) r.note.hidden = !show;
    if (!typing[n] && r.ta.value !== s.note) r.ta.value = s.note;
    if (show) grow(r.ta);
  }

  /* ---------- filters and counts ---------- */
  var FILTERS = [
    { id: "all", label: "All" },
    { id: "todo", label: "To decide" },
    { id: "keep", label: "Keep" },
    { id: "modify", label: "Modify" },
    { id: "discard", label: "Discard" },
    { id: "heart", label: "Hearts" }
  ];
  var EMPTY = {
    todo: "Every dish has an answer. Nick has his orders.",
    keep: "Nothing marked Keep yet.",
    modify: "Nothing marked Modify yet.",
    discard: "Nothing discarded yet.",
    heart: "No hearts yet. Tap the heart on anything you really, really want."
  };
  var chipEls = {};

  function matches(n, f) {
    var s = get(n);
    if (f === "all") return true;
    if (f === "todo") return !s.status;
    if (f === "heart") return s.heart;
    return s.status === f;
  }
  function count(f) {
    return DISHES.filter(function (d) { return matches(d.n, f); }).length;
  }
  function buildChips() {
    var box = document.getElementById("chips");
    var pick = el("label", "chip sort", "<span>Sort</span>");
    var sel = el("select");
    sel.setAttribute("aria-label", "Sort dishes");
    Object.keys(SORTS).forEach(function (k) {
      var o = el("option", "", esc(SORTS[k]));
      o.value = k;
      sel.appendChild(o);
    });
    sel.value = sort;
    sel.addEventListener("change", function () {
      sort = SORTS[sel.value] ? sel.value : "menu";
      try { localStorage.setItem(SKEY, sort); } catch (e) {}
      arrange();
      applyFilter();
      var top = document.querySelector(".hero").offsetHeight;
      if (window.scrollY > top) window.scrollTo(0, top);
    });
    pick.appendChild(sel);
    box.appendChild(pick);
    FILTERS.forEach(function (f) {
      var b = el("button", "chip", esc(f.label) + "<b></b>");
      b.type = "button";
      b.addEventListener("click", function () { filter = f.id; applyFilter(); });
      box.appendChild(b);
      chipEls[f.id] = b;
    });
  }
  var SORTS = { menu: "Menu order", health: "Healthiest first", yummy: "Yummiest first" };

  // Menu order keeps the course sections; a rating sort puts every dish in one list,
  // best first, with the other rating breaking ties.
  function arrange() {
    var order = DISHES.slice();
    if (sort !== "menu") {
      var a = sort === "health" ? "h" : "y";
      var b = sort === "health" ? "y" : "h";
      order.sort(function (p, q) {
        return q[a] - p[a] || q[b] - p[b] || DISHES.indexOf(p) - DISHES.indexOf(q);
      });
      flat.h2.textContent = SORTS[sort];
    }
    order.forEach(function (d) {
      (sort === "menu" ? rows[d.n].home.ul : flat.ul).appendChild(rows[d.n].li);
    });
  }

  // Rows only move in or out when a filter is tapped, so a dish never jumps away mid-edit.
  function applyFilter() {
    var any = false;
    DISHES.forEach(function (d) {
      var show = matches(d.n, filter);
      rows[d.n].li.hidden = !show;
      rows[d.n].li.classList.remove("first");
      if (show) any = true;
    });
    sections.concat([flat]).forEach(function (g) {
      var first = null;
      for (var i = 0; i < g.ul.children.length && !first; i++) {
        if (!g.ul.children[i].hidden) first = g.ul.children[i];
      }
      g.sec.hidden = !first;
      if (first) first.classList.add("first");
    });
    DISHES.forEach(function (d) {
      if (!rows[d.n].li.hidden && get(d.n).status === "modify") grow(rows[d.n].ta);
    });
    var empty = document.getElementById("empty");
    empty.hidden = any;
    empty.textContent = any ? "" : (EMPTY[filter] || "");
    FILTERS.forEach(function (f) {
      chipEls[f.id].setAttribute("aria-pressed", f.id === filter ? "true" : "false");
    });
  }
  function renderCounts() {
    var total = DISHES.length;
    var c = { keep: count("keep"), modify: count("modify"), discard: count("discard") };
    var done = c.keep + c.modify + c.discard;
    document.getElementById("progress").textContent =
      done === total ? "All " + total + " decided" : done + " of " + total + " decided";
    document.getElementById("mKeep").style.width = (100 * c.keep / total) + "%";
    document.getElementById("mModify").style.width = (100 * c.modify / total) + "%";
    document.getElementById("mDiscard").style.width = (100 * c.discard / total) + "%";
    FILTERS.forEach(function (f) {
      chipEls[f.id].querySelector("b").textContent = count(f.id);
    });
  }

  /* ---------- start ---------- */
  state = readJSON(CACHE);
  queue = readJSON(QKEY);
  try { sort = localStorage.getItem(SKEY) || "menu"; } catch (e) {}
  if (!SORTS[sort]) sort = "menu";
  build();
  buildChips();
  arrange();
  DISHES.forEach(function (d) { renderRow(d.n); });
  renderCounts();
  applyFilter();
  pull();

  setInterval(function () {
    if (document.visibilityState === "visible") pull();
  }, 5000);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") pull();
  });
  window.addEventListener("online", pull);
  window.addEventListener("pagehide", function () {
    leaving = true;
    Object.keys(timers).forEach(function (n) { if (timers[n]) commitNote(n); });
    flush();
  });
  window.addEventListener("pageshow", function () { leaving = false; });
})();
</script>
</body>
</html>
